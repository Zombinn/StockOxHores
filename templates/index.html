<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockOxHores · 信息匹配</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Noto Sans SC"', 'sans-serif'], mono: ['"JetBrains Mono"', '"SF Mono"', 'Menlo', 'monospace'] },
      colors: {
        zinc: { 950: '#0a0a0c', 900: '#141417', 850: '#1a1a1f', 800: '#1f1f24', 750: '#27272c', 700: '#2f2f35', 600: '#52525b', 500: '#71717a', 400: '#a1a1aa', 300: '#d4d4d8', 200: '#e4e4e7', 100: '#f4f4f5' },
        rise:  { DEFAULT: '#22c55e', 400: '#4ade80', 600: '#16a34a', 900: '#14532d' },
        fall:  { DEFAULT: '#ef4444', 400: '#f87171', 600: '#dc2626', 900: '#7f1d1d' },
        acc:   { DEFAULT: '#22d3ee', 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 800: '#155e75' },
      },
    },
  },
}
</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0a0a0c; color: #d4d4d8; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: #0a0a0c; }
  ::-webkit-scrollbar-thumb { background: #2f2f35; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #52525b; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; }

  .sb { width: 200px; min-width: 200px; background: #141417; border-right: 1px solid #1f1f24; overflow-y: auto; display: flex; flex-direction: column; }
  .sb-item { cursor: pointer; padding: 6px 14px; border-bottom: 1px solid #1a1a1f; transition: all .1s; display: flex; align-items: center; gap: 8px; }
  .sb-item:hover { background: #1f1f24; }
  .sb-item.active { background: #08303a; border-left: 2px solid #22d3ee; }

  .tab { cursor: pointer; padding: 6px 14px; font-size: 12px; color: #52525b; border-bottom: 1.5px solid transparent; transition: all .12s; white-space: nowrap; }
  .tab:hover { color: #a1a1aa; }
  .tab.active { color: #22d3ee; border-bottom-color: #22d3ee; }

  .sinp { background: #1a1a1f; border: 1px solid #27272c; border-radius: 4px; padding: 4px 10px; font-size: 12px; color: #d4d4d8; outline: none; }
  .sinp:focus { border-color: #0891b2; }
  .sinp::placeholder { color: #52525b; }

  .nitem { padding: 8px 0; border-bottom: 1px solid #141417; }
  .nitem:last-child { border-bottom: none; }
  .nitem a { color: #d4d4d8; text-decoration: none; font-size: 13px; line-height: 1.4; }
  .nitem a:hover { color: #22d3ee; }

  .badge { display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 500; }

  /* Timeline */
  .tl { position: relative; padding-left: 24px; }
  .tl::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 1px; background: #27272c; }
  .tl-item { position: relative; padding-bottom: 12px; }
  .tl-dot { position: absolute; left: -20px; top: 4px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid; }
  .tl-time { font-size: 10px; color: #52525b; font-family: 'JetBrains Mono', monospace; margin-bottom: 2px; }
</style>
</head>
<body>

<div x-data="app()" x-init="init()" class="flex h-screen overflow-hidden">

  <!-- ===== SIDEBAR ===== -->
  <div class="sb">
    <div class="px-4 py-3 border-b border-zinc-800/50">
      <div class="flex items-center gap-2">
        <span class="text-acc text-lg leading-none">⊕</span>
        <span class="text-sm font-semibold text-zinc-100 tracking-tight">StockOxHores</span>
      </div>
      <div class="text-[10px] text-zinc-600 mt-1 mono"><span x-text="stats.stocks"></span> 标的 · <span x-text="stats.news_records || 0"></span> 条新闻</div>
    </div>

    <div class="px-3 py-2">
      <input type="text" x-model="searchQuery" @input="filterStocks()" placeholder="搜索股票" class="sinp w-full">
    </div>

    <div class="flex-1 overflow-y-auto">
      <template x-for="s in filteredStocks" :key="s">
        <div class="sb-item" :class="{ active: view === 'stock' && selectedStock === s }" @click="selectStock(s)">
          <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" :class="hasNews(s) ? 'bg-acc/60' : 'bg-zinc-700'"></span>
          <span class="mono text-xs flex-1" x-text="s"></span>
          <span class="text-[10px] text-zinc-500 truncate max-w-[80px] text-right" x-text="name(s)"></span>
          <span class="text-[10px] text-zinc-600 mono ml-1" x-text="newsCount(s)"></span>
        </div>
      </template>
      <div x-show="filteredStocks.length === 0" class="p-4 text-zinc-600 text-[11px] text-center">无匹配</div>
    </div>

    <div class="px-4 py-2 border-t border-zinc-800/50 text-[10px] text-zinc-600 flex justify-between mono">
      <span>新闻 <span x-text="stats.news_records || 0"></span></span>
      <span>宏观 <span x-text="stats.macro_records || 0"></span></span>
    </div>
  </div>

  <!-- ===== MAIN ===== -->
  <div class="flex-1 flex flex-col overflow-hidden bg-zinc-950">

    <!-- Top bar -->
    <div class="flex items-center px-5 pt-2 pb-0 border-b border-zinc-800/30 bg-zinc-950 flex-shrink-0 gap-4">
      <template x-for="t in tabs" :key="t.id">
        <div class="tab" :class="{ active: view === t.id }" @click="view = t.id; loadView()" x-text="t.label"></div>
      </template>
      <div class="flex-1"></div>
      <div class="text-[10px] text-zinc-600 mono flex items-center gap-1">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-rise/60"></span>
        <span x-text="dbStatus"></span>
      </div>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto px-5 py-4" style="padding-bottom: 44px;">

      <!-- ===== 今 TODAY ===== -->
      <template x-if="view === 'today'">
        <div class="">
          <div class="text-sm font-medium text-zinc-300 mb-4">今日情报 · <span class="mono text-zinc-500" x-text="todayStr"></span></div>

          <!-- Stats row -->
          <div class="grid grid-cols-4 gap-px bg-zinc-800/20 rounded overflow-hidden mb-5">
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">监控标的</div><div class="mono text-lg text-zinc-100 mt-0.5" x-text="stats.stocks || '—'"></div></div>
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">今日新闻</div><div class="mono text-lg text-acc mt-0.5" x-text="todayNewsCount"></div></div>
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">宏观快讯</div><div class="mono text-lg text-zinc-100 mt-0.5" x-text="todayMacroCount"></div></div>
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">有新闻标的</div><div class="mono text-lg text-zinc-100 mt-0.5" x-text="activeStockCount"></div></div>
          </div>

          <!-- Today's news by stock -->
          <div x-show="todayNews.length">
            <div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-2 font-medium">个股新闻</div>
            <template x-for="(news, code) in todayByStock" :key="code">
              <div class="mb-4">
                <div class="flex items-center gap-2 mb-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-acc/60"></span>
                  <span class="mono text-xs text-zinc-300 font-medium" x-text="code"></span>
                  <span class="text-[10px] text-zinc-600" x-text="news.length + ' 条'"></span>
                </div>
                <div class="ml-4 space-y-1">
                  <template x-for="n in news.slice(0, 5)" :key="n.title">
                    <div class="text-xs text-zinc-400 hover:text-zinc-200 cursor-pointer leading-relaxed"
                         @click="selectedStock = code; view='stock'; loadStockNews()">
                      <span class="text-[10px] text-zinc-600 mono mr-1" x-text="n.source"></span>
                      <span x-text="n.title"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <!-- Today's macro -->
          <div x-show="todayMacro.length" class="mt-5">
            <div class="text-[11px] text-zinc-400 uppercase tracking-wider mb-2 font-medium">宏观快讯</div>
            <div class="tl">
              <template x-for="e in todayMacro.slice(0, 10)" :key="e.id || e.title">
                <div class="tl-item">
                  <div class="tl-dot" :class="e.importance >= 4 ? 'border-fall' : e.importance === 3 ? 'border-amber-500' : 'border-zinc-600'"></div>
                  <div class="tl-time" x-text="e.event_time || e.event_date"></div>
                  <div class="text-xs text-zinc-300 leading-relaxed" x-text="e.title"></div>
                  <div x-show="e.content" class="text-[11px] text-zinc-600 mt-0.5 line-clamp-2" x-text="e.content"></div>
                </div>
              </template>
            </div>
          </div>

          <div x-show="!todayNews.length && !todayMacro.length" class="text-xs text-zinc-600 py-8 text-center">今日暂无数据</div>
        </div>
      </template>

      <!-- ===== 标的 STOCK ===== -->
      <template x-if="view === 'stock'">
        <div class="">
          <div x-show="selectedStock">
            <div class="flex items-center justify-between mb-4">
              <div>
                <span class="text-base font-semibold text-zinc-100 mono" x-text="selectedStock"></span>
                <span class="text-xs text-zinc-500 ml-2" x-text="name(selectedStock)"></span>
                <span class="text-xs text-zinc-600 ml-1" x-text="'· ' + stockNews.length + ' 篇'"></span>
              </div>
            </div>

            <!-- News timeline -->
            <div x-show="stockNews.length" class="tl">
              <template x-for="(n, i) in stockNews" :key="n.id || n.title">
                <div class="tl-item">
                  <div class="tl-dot border-acc"></div>
                  <div class="tl-time flex items-center gap-2">
                    <span class="text-[10px] px-1.5 rounded bg-zinc-800 text-zinc-500" x-text="n.source"></span>
                    <span x-text="n.news_time || n.news_date"></span>
                  </div>
                  <a :href="n.url" target="_blank" class="text-xs text-zinc-300 hover:text-acc no-underline leading-relaxed" x-text="n.title"></a>
                </div>
              </template>
            </div>
            <div x-show="!stockNews.length" class="text-xs text-zinc-600 py-8 text-center">暂无新闻</div>
          </div>
          <div x-show="!selectedStock" class="text-xs text-zinc-600 py-8 text-center">从左侧选择一只股票</div>
        </div>
      </template>

      <!-- ===== 新闻 NEWS ===== -->
      <template x-if="view === 'news'">
        <div class="">
          <div class="flex items-center gap-2 mb-3 flex-wrap">
            <input type="text" x-model="newsQuery" @input.debounce="loadAllNews()" placeholder="关键词" class="sinp w-40">
            <input type="date" x-model="newsDate" @change="loadAllNews()" class="sinp w-auto">
            <select x-model="newsCode" @change="loadAllNews()" class="sinp w-auto">
              <option value="">全部标的</option>
              <template x-for="s in stocks" :key="s"><option :value="s" x-text="s"></option></template>
            </select>
          </div>
          <div x-show="allNews.length">
            <template x-for="n in allNews" :key="n.id || n.title + n.news_date">
              <div class="nitem">
                <div class="flex items-start gap-2">
                  <span class="text-[10px] mono shrink-0 w-8 text-center"
                        :class="n.source === '东方财富' ? 'text-acc/70' : 'text-orange-400/70'"
                        x-text="n.source === '东方财富' ? '东财' : n.source"></span>
                  <a :href="n.url" target="_blank" class="flex-1 min-w-0" x-text="n.title"></a>
                </div>
                <div class="flex gap-3 text-[10px] text-zinc-600 mt-0.5 ml-10">
                  <span class="mono" x-text="n.ts_code"></span>
                  <span x-text="n.news_time || n.news_date"></span>
                </div>
              </div>
            </template>
          </div>
          <div x-show="!allNews.length" class="text-xs text-zinc-600 py-8 text-center">无匹配新闻</div>
        </div>
      </template>

      <!-- ===== 宏观 MACRO ===== -->
      <template x-if="view === 'macro'">
        <div class="">
          <div class="flex items-center gap-2 mb-3">
            <input type="date" x-model="macroDate" @change="loadMacro()" class="sinp w-auto">
          </div>
          <div x-show="macroList.length" class="tl">
            <template x-for="e in macroList" :key="e.id || e.title">
              <div class="tl-item">
                <div class="tl-dot" :class="e.importance >= 4 ? 'border-fall' : e.importance === 3 ? 'border-amber-500' : 'border-zinc-600'"></div>
                <div class="tl-time">
                  <span class="text-[10px] px-1.5 rounded bg-zinc-800 text-zinc-500 mr-1" x-text="e.category"></span>
                  <span x-text="e.event_time || e.event_date"></span>
                </div>
                <div class="text-xs text-zinc-300 leading-relaxed" x-text="e.title"></div>
                <div x-show="e.content" class="text-[11px] text-zinc-600 mt-0.5 line-clamp-2" x-text="e.content"></div>
              </div>
            </template>
          </div>
          <div x-show="!macroList.length" class="text-xs text-zinc-600 py-8 text-center">暂无宏观快讯</div>
        </div>
      </template>

      <!-- ===== 日志 LOGS ===== -->
      <template x-if="view === 'logs'">
        <div>
          <div class="overflow-x-auto max-h-[70vh] overflow-y-auto">
            <table class="tbl">
              <thead><tr><th>日期</th><th>模块</th><th>标的</th><th>状态</th><th>记录</th><th>耗时</th></tr></thead>
              <tbody>
                <template x-for="l in logList" :key="l.id">
                  <tr>
                    <td class="text-zinc-500 text-[11px] mono" x-text="l.run_date"></td>
                    <td class="text-[11px] text-zinc-400" x-text="l.module"></td>
                    <td class="text-[11px] text-zinc-500 mono" x-text="l.ts_code"></td>
                    <td><span class="badge" :class="l.status==='success' ? 'bg-rise/10 text-rise/80' : l.status==='error' ? 'bg-fall/10 text-fall/80' : 'bg-zinc-800 text-zinc-500'" x-text="l.status"></span></td>
                    <td class="text-zinc-500 mono" x-text="l.records"></td>
                    <td class="text-zinc-600 text-[11px] mono" x-text="l.duration_s ? l.duration_s.toFixed(1)+'s' : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div x-show="!logList.length" class="text-xs text-zinc-600 py-8 text-center">暂无日志</div>
          </div>
        </div>
      </template>

      <!-- ===== 分析 ANALYSIS ===== -->
      <template x-if="view === 'analysis'">
        <div class="">
          <!-- Sentiment summary -->
          <div class="text-sm font-medium text-zinc-300 mb-3">情感总览</div>
          <div class="grid grid-cols-3 gap-px bg-zinc-800/20 rounded overflow-hidden mb-5">
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">正面</div><div class="mono text-lg text-rise mt-0.5" x-text="sentiment.pos || '—'"></div></div>
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">中性</div><div class="mono text-lg text-zinc-400 mt-0.5" x-text="sentiment.neu || '—'"></div></div>
            <div class="p-3 bg-zinc-900/60"><div class="text-[10px] text-zinc-600 uppercase tracking-wider">负面</div><div class="mono text-lg text-fall mt-0.5" x-text="sentiment.neg || '—'"></div></div>
          </div>
          <div class="text-[10px] text-zinc-600 mono mb-4" x-show="sentiment.total">分析 <span x-text="sentiment.total"></span> 条 · 正负比 <span x-text="sentiment.ratio"></span></div>

          <!-- 双栏: 日关联 + 个股时间线 -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <div class="text-sm font-medium text-zinc-300 mb-3">新闻-涨跌关联</div>
              <div class="flex items-center gap-2 mb-3">
                <input type="date" x-model="corrDate" class="sinp w-auto">
                <button @click="loadCorrelation()" class="text-xs px-3 py-1 rounded bg-acc/10 text-acc hover:bg-acc/20 border border-acc/20">查询</button>
              </div>

              <div x-show="corrData.length" class="space-y-2">
                <template x-for="r in corrData" :key="r.ts_code">
                  <div class="p-3 rounded bg-zinc-900/40 border border-zinc-800/30">
                    <div class="flex items-center justify-between mb-1">
                      <span class="mono text-xs text-zinc-300 font-medium cursor-pointer hover:text-acc"
                            @click="selectStock(r.ts_code); view='stock'"
                            x-text="r.ts_code + ' ' + (name(r.ts_code))"></span>
                      <span class="mono text-xs" :class="(r.change_pct||0) >= 0 ? 'text-rise' : 'text-fall'"
                            x-text="r.change_pct ? (r.change_pct >= 0 ? '+' : '') + r.change_pct.toFixed(2) + '%' : '—'"></span>
                    </div>
                    <div class="flex gap-2 text-[10px] text-zinc-600 mb-1">
                      <span><span x-text="r.news_count"></span> 篇</span>
                      <span :class="r.avg_sentiment > 0.3 ? 'text-rise/70' : r.avg_sentiment < -0.3 ? 'text-fall/70' : ''">
                        <span x-text="sentimentLabel(r.avg_sentiment)"></span> <span x-text="r.avg_sentiment >= 0 ? '+' : ''"></span><span x-text="r.avg_sentiment.toFixed(2)"></span>
                      </span>
                      <span x-show="r.vol">量 <span x-text="(r.vol/10000).toFixed(0)"></span>万</span>
                    </div>
                    <div x-show="r.news.length">
                      <template x-for="n in r.news.slice(0, 4)" :key="n.title">
                        <div class="text-[11px] text-zinc-400 leading-relaxed truncate hover:text-zinc-200 cursor-pointer"
                             @click="selectedStock=r.ts_code; view='stock'; loadStockNews()">
                          <span class="text-[10px] font-mono mr-1"
                                :class="n.sentiment > 0 ? 'text-rise/60' : n.sentiment < 0 ? 'text-fall/60' : 'text-zinc-600'"
                                x-text="n.sentiment > 0 ? '▲' : n.sentiment < 0 ? '▼' : '▬'"></span>
                          <span x-text="n.title"></span>
                        </div>
                      </template>
                      <div x-show="r.news.length > 4" class="text-[10px] text-zinc-600 mt-0.5 cursor-pointer hover:text-acc"
                           @click="selectedStock=r.ts_code; view='stock'; loadStockNews()">……全部 <span x-text="r.news.length"></span> 篇 →</div>
                    </div>
                  </div>
                </template>
              </div>
              <div x-show="corrDate && !corrData.length" class="text-xs text-zinc-600 py-4 text-center">该日无数据</div>
            </div>

            <div>
              <div class="text-sm font-medium text-zinc-300 mb-3">个股情感时间线</div>
              <div class="flex items-center gap-2 mb-3">
                <select x-model="corrStock" @change="loadStockCorr()" class="sinp w-auto">
                  <option value="">选择股票</option>
                  <template x-for="s in stocks" :key="s"><option :value="s" x-text="s + ' ' + (name(s))"></option></template>
                </select>
                <select x-model="corrDays" @change="loadStockCorr()" class="sinp w-auto">
                  <option value="10">10天</option><option value="30" selected>30天</option><option value="60">60天</option>
                </select>
              </div>
              <div x-show="corrStock">
                <div x-show="corrTimeline.length" class="space-y-1 max-h-[500px] overflow-y-auto">
                  <template x-for="d in corrTimeline" :key="d.trade_date">
                    <div class="flex items-center gap-3 py-1.5 px-2 rounded hover:bg-zinc-900/40 text-xs">
                      <span class="mono text-zinc-500 w-20 shrink-0" x-text="d.trade_date"></span>
                      <span class="mono w-14 text-right" :class="(d.change_pct||0) >= 0 ? 'text-rise' : 'text-fall'"
                            x-text="d.change_pct ? (d.change_pct >= 0 ? '+' : '') + d.change_pct.toFixed(1) + '%' : '—'"></span>
                      <div class="flex-1 h-2 rounded bg-zinc-800 relative overflow-hidden">
                        <div class="h-full rounded" :style="'width:' + Math.min(Math.abs(d.avg_sentiment||0)*50, 100) + '%'"
                             :class="(d.avg_sentiment||0) >= 0 ? 'bg-rise/50 ml-auto' : 'bg-fall/50'"></div>
                      </div>
                      <span class="mono text-zinc-600 w-8 text-right" x-text="d.news_count"></span>
                      <span class="text-zinc-600 w-12 text-right text-[10px]" x-show="d.vol" x-text="(d.vol/10000).toFixed(0)+'万'"></span>
                    </div>
                  </template>
                </div>
                <div x-show="!corrTimeline.length" class="text-xs text-zinc-600 py-4 text-center">加载中或暂无数据</div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ===== 任务 TASKS ===== -->
      <template x-if="view === 'tasks'">
        <div class="">
          <div class="text-sm font-medium text-zinc-300 mb-4">定时任务</div>

          <template x-for="job in cronJobs" :key="job.job_id">
            <div class="mb-4 p-4 rounded bg-zinc-900/40 border border-zinc-800/30 cursor-pointer hover:border-zinc-600/50 transition-colors"
                 @click="showJobLogs(job)">
              <div class="flex items-center justify-between mb-2">
                <div x-show="editingJob !== job.job_id">
                  <span class="text-sm text-zinc-200 font-medium" x-text="job.name"></span>
                  <span class="ml-2 text-[10px] px-2 py-0.5 rounded-full"
                        :class="job.state === 'scheduled' ? 'bg-rise/10 text-rise/80' : job.state === 'paused' ? 'bg-fall/10 text-fall/80' : 'bg-zinc-800 text-zinc-500'"
                        x-text="job.state"></span>
                </div>
                <div class="flex gap-1" x-show="editingJob !== job.job_id">
                  <button @click.stop="editCron(job)" class="text-[10px] px-2 py-1 rounded bg-zinc-800 text-zinc-400 hover:bg-zinc-700 border border-zinc-700">编辑</button>
                  <button @click.stop="cronRun(job.job_id)" class="text-[10px] px-2 py-1 rounded bg-acc/10 text-acc hover:bg-acc/20 border border-acc/20">执行</button>
                  <button x-show="job.state === 'scheduled'" @click.stop="cronPause(job.job_id)" class="text-[10px] px-2 py-1 rounded bg-zinc-800 text-zinc-400 hover:bg-zinc-700 border border-zinc-700">暂停</button>
                  <button x-show="job.state === 'paused'" @click.stop="cronResume(job.job_id)" class="text-[10px] px-2 py-1 rounded bg-rise/10 text-rise/80 hover:bg-rise/20 border border-rise/20">恢复</button>
                </div>
              </div>

              <!-- Edit form -->
              <div x-show="editingJob === job.job_id" class="mb-3 space-y-2">
                <div><label class="text-[10px] text-zinc-600 block mb-0.5">任务名称</label>
                  <input type="text" x-model="editName" class="sinp w-full"></div>
                <div><label class="text-[10px] text-zinc-600 block mb-0.5">调度周期 (cron)</label>
                  <input type="text" x-model="editSchedule" class="sinp w-full" placeholder="0 17 * * 1-5"></div>
                <div class="flex gap-2">
                  <button @click.stop="saveCron(job.job_id)" class="text-[10px] px-3 py-1 rounded bg-acc/10 text-acc hover:bg-acc/20 border border-acc/20">保存</button>
                  <button @click.stop="editingJob = ''" class="text-[10px] px-3 py-1 rounded bg-zinc-800 text-zinc-400 border border-zinc-700">取消</button>
                </div>
              </div>

              <div x-show="editingJob !== job.job_id" class="grid grid-cols-2 gap-2 text-[11px] text-zinc-500">
                <div><span class="text-zinc-600">周期:</span> <span class="mono" x-text="job.schedule || '—'"></span></div>
                <div><span class="text-zinc-600">重复:</span> <span x-text="job.repeat || '—'"></span></div>
                <div><span class="text-zinc-600">下次执行:</span> <span class="mono" x-text="job.next_run_at ? new Date(job.next_run_at).toLocaleString('zh-CN') : '—'"></span></div>
                <div><span class="text-zinc-600">上次状态:</span>
                  <span :class="job.last_status === 'success' ? 'text-rise' : job.last_status === 'error' ? 'text-fall' : ''" x-text="job.last_status || '—'"></span>
                </div>
                <div x-show="job.last_run_at"><span class="text-zinc-600">上次执行:</span> <span class="mono" x-text="new Date(job.last_run_at).toLocaleString('zh-CN')"></span></div>
              </div>
              <div x-show="job.last_error" class="mt-2 text-[10px] text-fall/70 bg-fall/5 rounded p-2 font-mono leading-relaxed break-all" x-text="job.last_error"></div>
            </div>
          </template>
          <div x-show="!cronJobs.length" class="text-xs text-zinc-600 py-8 text-center">暂无定时任务</div>
        </div>
      </template>

    </div><!-- /content -->

    <!-- ===== Modal ===== -->
    <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
         @click.self="showModal = false">
      <div class="bg-zinc-900 border border-zinc-700 rounded-lg w-[90vw] max-w-3xl max-h-[80vh] flex flex-col">
        <div class="flex items-center justify-between px-5 py-3 border-b border-zinc-800">
          <div>
            <span class="text-sm font-medium text-zinc-200" x-text="modalTitle"></span>
            <span class="ml-2 text-[10px] text-zinc-500" x-text="modalLogs.length + ' 次运行'"></span>
          </div>
          <button @click="showModal = false" class="text-zinc-500 hover:text-zinc-300 text-lg leading-none">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-2">
          <template x-for="(l, idx) in modalLogs" :key="l.run_date + l.module + l.ts_code">
            <div class="p-3 rounded bg-zinc-800/30 border border-zinc-800/50 text-xs cursor-pointer hover:border-zinc-600/50 transition-colors"
                 @click="expandedLog = (expandedLog === idx ? -1 : idx)">
              <div class="flex items-center justify-between mb-1">
                <span class="mono text-zinc-400" x-text="l.created_at || l.run_date"></span>
                <span class="badge" :class="l.status==='success' ? 'bg-rise/10 text-rise/80' : l.status==='error' ? 'bg-fall/10 text-fall/80' : 'bg-zinc-800 text-zinc-500'" x-text="l.status"></span>
              </div>
              <div class="flex gap-3 text-[10px] text-zinc-600">
                <span>模块: <span class="mono" x-text="l.module"></span></span>
                <span>标的: <span class="mono" x-text="l.ts_code"></span></span>
                <span x-show="l.records">记录: <span x-text="l.records"></span></span>
                <span x-show="l.duration_s">耗时: <span x-text="l.duration_s.toFixed(1)+'s'"></span></span>
              </div>
              <div x-show="expandedLog === idx" class="mt-2 pt-2 border-t border-zinc-800/50">
                <div x-show="l.message" class="text-[10px] text-fall/70 bg-fall/5 rounded p-2 font-mono leading-relaxed break-all mb-1" x-text="l.message"></div>
                <div class="grid grid-cols-2 gap-1 text-[10px] text-zinc-600">
                  <div>模块: <span class="mono text-zinc-400" x-text="l.module"></span></div>
                  <div>标的: <span class="mono text-zinc-400" x-text="l.ts_code"></span></div>
                  <div>记录数: <span class="mono text-zinc-400" x-text="l.records"></span></div>
                  <div>耗时: <span class="mono text-zinc-400" x-text="l.duration_s ? l.duration_s.toFixed(1)+'s' : '—'"></span></div>
                  <div>状态: <span class="text-zinc-400" x-text="l.status"></span></div>
                  <div>时间: <span class="mono text-zinc-400" x-text="l.created_at || l.run_date"></span></div>
                </div>
              </div>
            </div>
          </template>
          <div x-show="!modalLogs.length" class="text-xs text-zinc-600 py-6 text-center">暂无运行记录</div>
        </div>
      </div>
    </div>

    <!-- Floating bar -->
    <div class="fixed bottom-0 left-[200px] right-0 bg-zinc-900/80 backdrop-blur border-t border-zinc-800/50 px-5 py-[6px] text-[10px] text-zinc-600 flex items-center gap-4 z-10 mono">
      <span>新闻 <span x-text="stats.news_records || 0"></span></span>
      <span>宏观 <span x-text="stats.macro_records || 0"></span></span>
      <span>标的 <span x-text="stats.stocks || 0"></span></span>
      <span class="flex-1"></span>
      <span class="text-acc/70" x-text="dbStatus"></span>
    </div>
  </div>
</div>

<style>
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; padding: 6px 10px; font-size: 10px; font-weight: 500; color: #52525b; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #1f1f24; }
  .tbl td { padding: 5px 10px; border-bottom: 1px solid #141417; font-size: 12px; mono: true; white-space: nowrap; }
  .tbl tr:hover td { background: #141417; }
</style>

<script>
function app() {
  return {
    stocks: [], names: {}, stats: {},
    view: 'today', selectedStock: '', searchQuery: '',
    todayNews: [], todayMacro: [], allNews: [],
    stockNews: [],
    newsQuery: '', newsDate: '', newsCode: '',
    macroList: [], macroDate: '',
    logList: [],
    cronJobs: [],
    editingJob: '', editName: '', editSchedule: '',
    showModal: false, modalTitle: '', modalLogs: [], expandedLog: -1,
    sentiment: {}, corrData: [], corrTimeline: [],
    corrDate: new Date().toISOString().slice(0,10), corrStock: '', corrDays: '30',
    dbStatus: '···',

    tabs: [
      { id: 'today', label: '今' },
      { id: 'stock', label: '标的' },
      { id: 'news',  label: '新闻' },
      { id: 'macro', label: '宏观' },
      { id: 'analysis',  label: '分析' },
      { id: 'tasks',  label: '任务' },
      { id: 'logs',  label: '日志' },
    ],

    get todayStr() {
      return new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'short' });
    },
    get filteredStocks() {
      if (!this.searchQuery) return this.stocks;
      return this.stocks.filter(s => s.toUpperCase().includes(this.searchQuery.toUpperCase()));
    },
    get todayNewsCount() {
      const t = new Date().toISOString().slice(0, 10);
      return this.todayNews.filter(n => n.news_date === t || n.news_date === t.replace(/-/g, '-')).length;
    },
    get todayMacroCount() { return this.todayMacro.length; },
    get activeStockCount() {
      const t = new Date().toISOString().slice(0, 10);
      return new Set(this.todayNews.filter(n => n.news_date === t).map(n => n.ts_code)).size;
    },
    get todayByStock() {
      const map = {};
      const t = new Date().toISOString().slice(0, 10);
      this.todayNews.filter(n => n.news_date === t).forEach(n => {
        if (!map[n.ts_code]) map[n.ts_code] = [];
        map[n.ts_code].push(n);
      });
      return map;
    },

    async init() {
      await this.loadStats();
      await this.loadStocks();
      await this.loadNames();
      await this.loadToday();
      setInterval(() => this.loadStats(), 30000);
    },

    async api(p) {
      try { const r = await fetch(p); if (!r.ok) throw new Error(); return await r.json(); }
      catch(e) { return null; }
    },

    async loadStats() {
      const d = await this.api('/api/stats');
      if (d) { this.stats = d; this.dbStatus = '✓'; }
    },
    async loadStocks() {
      const d = await this.api('/api/stocks');
      if (d) this.stocks = d;
    },
    async loadNames() {
      const d = await this.api('/api/stocks/names');
      if (d) this.names = d;
    },
    async loadToday() {
      const t = new Date().toISOString().slice(0, 10);
      const [news, macro] = await Promise.all([
        this.api(`/api/news?date=${t}&limit=100`),
        this.api(`/api/macro?date=${t}`),
      ]);
      if (news) this.todayNews = news;
      if (macro) this.macroList = macro;
      this.macroDate = t;
    },
    async selectStock(code) {
      this.selectedStock = code; this.view = 'stock';
      const d = await this.api(`/api/stock/${code}/news?limit=100`);
      if (d) this.stockNews = d;
    },
    async loadAllNews() {
      const p = new URLSearchParams();
      if (this.newsQuery) p.set('q', this.newsQuery);
      if (this.newsDate) p.set('date', this.newsDate);
      if (this.newsCode) p.set('ts_code', this.newsCode);
      const d = await this.api(`/api/news?${p.toString()}&limit=100`);
      if (d) this.allNews = d;
    },
    async loadMacro() {
      const p = new URLSearchParams();
      if (this.macroDate) p.set('date', this.macroDate);
      const d = await this.api(`/api/macro?${p.toString()}`);
      if (d) this.macroList = d;
    },
    async loadView() {
      if (this.view === 'today') await this.loadToday();
      else if (this.view === 'news') await this.loadAllNews();
      else if (this.view === 'macro') await this.loadMacro();
      else if (this.view === 'logs') {
        const d = await this.api('/api/logs');
        if (d) this.logList = d;
      } else if (this.view === 'analysis') {
        await this.loadAnalysis();
      } else if (this.view === 'tasks') {
        await this.loadCron();
      }
    },

    hasNews(code) {
      return this.todayNews.some(n => n.ts_code === code);
    },
    newsCount(code) {
      return this.todayNews.filter(n => n.ts_code === code).length || '';
    },
    filterStocks() {},

    name(code) { return this.names[code] || code; },

    sentimentLabel(s) {
      if (s > 0.5) return '偏正面';
      if (s > 0.1) return '微正面';
      if (s < -0.5) return '偏负面';
      if (s < -0.1) return '微负面';
      return '中性';
    },

    async loadCron() {
      const d = await this.api('/api/cron');
      if (d && d.jobs) this.cronJobs = d.jobs;
    },
    async cronRun(id) {
      await this.api(`/api/cron/${id}/run`);
      await this.loadCron();
    },
    async cronPause(id) {
      await this.api(`/api/cron/${id}/pause`);
      await this.loadCron();
    },
    async cronResume(id) {
      await this.api(`/api/cron/${id}/resume`);
      await this.loadCron();
    },
    async showJobLogs(job) {
      this.modalTitle = job.name || '任务日志';
      const d = await this.api('/api/logs?limit=200');
      if (d) this.modalLogs = d.slice(0, 200);
      else this.modalLogs = [];
      this.showModal = true;
    },
    editCron(job) {
      this.editingJob = job.job_id;
      this.editName = job.name || '';
      this.editSchedule = job.schedule || '';
    },
    async saveCron(id) {
      const params = new URLSearchParams();
      if (this.editName) params.set('name', this.editName);
      if (this.editSchedule) params.set('schedule', this.editSchedule);
      const d = await this.api(`/api/cron/${id}/update?${params.toString()}`);
      this.editingJob = '';
      await this.loadCron();
    },

    async loadAnalysis() {
      const sent = await this.api('/api/analysis/sentiment-summary?days=30');
      if (sent) {
        const p = sent.positive || 0, n = sent.negative || 0, neu = sent.neutral || 0;
        this.sentiment = {
          pos: p, neg: n, neu: neu,
          total: sent.total_analyzed || (p + n + neu),
          ratio: n > 0 ? (p / n).toFixed(2) : (p > 0 ? '∞' : '—'),
        };
      }
      this.corrDate = new Date().toISOString().slice(0, 10);
      await this.loadCorrelation();
    },

    async loadCorrelation() {
      if (!this.corrDate) return;
      const d = await this.api(`/api/analysis/day/${this.corrDate}`);
      if (d) this.corrData = d;
    },

    async loadStockCorr() {
      if (!this.corrStock) return;
      const d = await this.api(`/api/analysis/stock/${this.corrStock}?days=${this.corrDays}`);
      if (d) this.corrTimeline = d;
    },
  };
}
</script>
</body>
</html>
